<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BearCruise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-panel">
      <img class="logo" src="images/BearCruiseLogo-bearpaw.jpg" alt="BearCruise.com logo">
      <h1 class="page-title">Scarlet New Years BearCruise Ahoy!</h1>
      <p class="subtitle bevan-regular">5-nights, December 30, 2026 &ndash; January 4, 2027</p>
    </div>
  </header>

  <!-- App data -->
  <main class="container">
    <h2 class="section-heading">Sailing on</h2>
    <div class="ship-info">
      <img class="vv-logo" src="virgin-voyages/VV-Logo.jpg" alt="Virgin Voyages logo">
      <img class="vv-ship-icon" src="virgin-voyages/ScarletLady-icon.jpg" alt="Scarlet Lady">
    </div>

    <h2 class="section-heading">Schedule</h2>
    <div class="picker">
      <label for="day-select">Select a day</label>
      <select id="day-select"></select>
    </div>

    <section id="schedule" class="schedule" aria-live="polite"></section>
  </main>

  <!-- Closing -->
  <section class="closing">
    <p>BearCruise.com <img class="closing-bearpaw" src="images/bearpaw.png" alt="Bear paw"> The most trusted name in gay travel.&#8480;</p>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <nav aria-label="BearCruise links">
      <ul class="footer-links">
        <li><a href="https://www.bearcruise.com" target="_blank" rel="noopener noreferrer">BearCruise.com</a></li>
        <li><a href="https://www.facebook.com/groups/24653056584369510" target="_blank" rel="noopener noreferrer">Facebook group</a></li>
        <li><a href="https://t.me/+3h3e7zQrebdjYTZh" target="_blank" rel="noopener noreferrer">Telegram channel</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
    <p class="copyright">&copy; Copyright 2027 BearCruise.com</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
